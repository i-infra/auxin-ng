[package]
name = "auxin-ng"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Scriptable, protocol-transparent Signal CLI built on presage"

[dependencies]
# i-infra forks carry profile avatar/payment-address, username and Groups v2
# write support on top of upstream whisperfish revs (presage 96f5e92 /
# libsignal-service 7aa4909, libsignal 0.99), pinned to commits on their
# `rebased-2026-10` branches; see docs/signal-cli-compat.md,
# docs/username-support.md and docs/implementing-groups.md.
presage = { git = "https://github.com/i-infra/presage", rev = "8756049091e186663c673ee34b2af4dff1e24d34" }
presage-store-sqlite = { git = "https://github.com/i-infra/presage", rev = "8756049091e186663c673ee34b2af4dff1e24d34" }

tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "io-std", "io-util", "fs", "time"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
hex = "0.4"
mime_guess = "2"
qr2term = "0.3"
url = "2"
directories = "6"
chrono = "0.4"
uuid = "1"

[build-dependencies]
protox = "0.9"
prost = "0.14"

# presage's manifest points at upstream whisperfish/libsignal-service-rs;
# redirect it to the i-infra fork carrying our profile/username/groups work.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { git = "https://github.com/i-infra/libsignal-service-rs", rev = "d7fa2a479f2c1959c6124c67064728de373adfb4" }

# For local development against sibling checkouts, comment out the patch
# above and use instead:
# [patch."https://github.com/i-infra/presage"]
# presage = { path = "../presage/presage" }
# presage-store-sqlite = { path = "../presage/presage-store-sqlite" }
# [patch."https://github.com/whisperfish/libsignal-service-rs"]
# libsignal-service = { path = "../libsignal-service-rs" }

# presage's workspace applies these patches; they don't propagate to consumers,
# so every downstream workspace has to repeat them (see presage README).
[patch.crates-io]
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }
