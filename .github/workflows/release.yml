name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in the builder container
        run: docker build --target artifact -o dist .
      - name: Package
        run: |
          tar -C dist -czf "auxin-ng-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" auxin-ng
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: auxin-ng-*.tar.gz
          if-no-files-found: error

  macos-aarch64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned version.
      - name: Build
        run: |
          cargo build --release --locked
          strip target/release/auxin-ng
      - name: Package
        run: |
          tar -C target/release -czf "auxin-ng-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz" auxin-ng
      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: auxin-ng-*.tar.gz
          if-no-files-found: error

  release:
    needs: [linux-amd64, macos-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "auxin-ng $GITHUB_REF_NAME" \
            --generate-notes \
            auxin-ng-*.tar.gz
